name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Default profile only - REST support, no Oracle Essbase JARs involved.
      - name: Build
        run: mvn -B package

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: target/essterm-*.jar
          generate_release_notes: true
